name: Acquire Unity activation file
on: workflow_dispatch
jobs:
  activation:
    name: Generate manual activation file (.alf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate .alf with the Unity editor in the GameCI image
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/workspace -w /workspace \
            unityci/editor:ubuntu-6000.3.0f1-android-4.0.0 \
            unity-editor -batchmode -nographics -logFile /dev/stdout \
            -createManualActivationFile -quit || true
          ls -la *.alf
      - uses: actions/upload-artifact@v4
        with:
          name: activation-file
          path: '*.alf'
          if-no-files-found: error
