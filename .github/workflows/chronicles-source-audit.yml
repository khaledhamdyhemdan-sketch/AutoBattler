name: Chronicles source audit

on:
  push:
    branches: [feature/egyptian-heroes-5v5]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: Roster / Unity metadata / English source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Run lightweight checks
        run: node tools/chronicles-source-audit.mjs
      - name: Inventory production art and build gaps
        run: node tools/chronicles-readiness-report.mjs
      - name: Upload readiness inventory
        uses: actions/upload-artifact@v4
        with:
          name: chronicles-readiness
          path: build-reports/chronicles-readiness.*
          retention-days: 14
      - name: Check backend syntax and security behavior
        working-directory: server
        run: |
          npm run check
          npm test
      - name: Explain build boundary
        run: echo "Source checks only; actual Unity Editor and Android APK/AAB validation still required."
