name: Capture Unity license state (internal)
on: workflow_dispatch
permissions:
  issues: write
jobs:
  capture:
    name: Activate + editor smoke + state capture
    runs-on: ubuntu-latest
    container: unityci/editor:ubuntu-6000.3.0f1-android-4.0.0
    timeout-minutes: 35
    steps:
      - name: Fixed machine-id
        run: echo "9f1c7a2b4d3e5f608192a4b6c8d0e2f4" > /etc/machine-id
      - name: Install unity-cli
        run: |
          curl -fsSL https://public-cdn.cloud.unity3d.com/hub/prod/cli/install.sh | UNITY_CLI_CHANNEL=beta bash
          find / -name unity -type f -path "*bin*" 2>/dev/null | head -3
      - name: Start login and publish URL
        run: |
          export PATH="$HOME/.local/bin:$HOME/.unity/bin:/root/.local/bin:$PATH"
          unity auth login --insecure-storage --no-banner > /tmp/auth.log 2>&1 &
          echo $! > /tmp/login.pid
          URL=""
          for i in $(seq 1 20); do
            sleep 3
            URL=$(grep -oE 'https://services\.api\.unity\.com[^ ]+' /tmp/auth.log | head -1 || true)
            if [ -n "$URL" ]; then break; fi
          done
          if [ -z "$URL" ]; then echo "NO_URL_CAPTURED"; cat /tmp/auth.log; exit 1; fi
          echo "URL_LEN=${#URL}"
          python3 - "$URL" <<'PY'
          import json, os, sys, urllib.request
          req = urllib.request.Request(
            "https://api.github.com/repos/%s/issues/8/comments" % os.environ["GITHUB_REPOSITORY"],
            data=json.dumps({"body": "CAPTURE2_LOGIN_URL: " + sys.argv[1]}).encode(),
            headers={"Authorization": "Bearer " + os.environ["TOKEN"], "Accept": "application/vnd.github+json"},
            method="POST")
          print("comment posted:", json.load(urllib.request.urlopen(req))["id"])
          PY
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Wait for sign-in completion
        run: |
          export PATH="$HOME/.local/bin:$HOME/.unity/bin:/root/.local/bin:$PATH"
          PID=$(cat /tmp/login.pid)
          DONE=timeout
          for i in $(seq 1 56); do
            sleep 15
            if unity auth status 2>/dev/null | grep -qi "signed in"; then DONE=status-signed-in; break; fi
            if ! kill -0 $PID 2>/dev/null; then DONE=process-exited; break; fi
          done
          echo "wait_result=$DONE"
          unity auth status || true
      - name: Activate Personal license
        run: |
          export PATH="$HOME/.local/bin:$HOME/.unity/bin:/root/.local/bin:$PATH"
          unity license activate --personal --accept-eula
          unity license status || true
      - name: Enumerate licensing state
        run: |
          echo "== candidate state files =="
          find / \( -name "*.ulf" -o -name "*.lic" -o -iname "*license*" -o -iname "*entitlement*" \) -type f 2>/dev/null | grep -viE "node_modules|/doc/|/share/doc|copyright|/proc/|/sys/" | head -40
          echo "== home tree =="
          find $HOME -type f 2>/dev/null | head -40
          echo "== /usr/share/unity3d /root =="
          ls -laR /usr/share/unity3d 2>/dev/null | head -20
      - name: Editor license smoke test
        run: |
          ls /opt/unity/Editor/Unity 2>/dev/null || find / -name Unity -type f -path "*Editor*" 2>/dev/null | head -3
          /opt/unity/Editor/Unity -batchmode -nographics -quit -logFile /tmp/ed.log || true
          echo "== editor log licensing lines =="
          grep -iE "licen|entitle|serial" /tmp/ed.log | head -25
          echo "== tail =="
          tail -5 /tmp/ed.log
      - name: Pack state
        run: |
          mkdir -p /tmp/stateout
          cp /tmp/ed.log /tmp/stateout/editor.log 2>/dev/null || true
          tar czf /tmp/stateout/home-state.tgz -C / github/home/.local github/home/.config github/home/.unity 2>/dev/null || true
          tar czf /tmp/stateout/sys-state.tgz /usr/share/unity3d /var/lib/unity3d /etc/machine-id 2>/dev/null || true
          ls -la /tmp/stateout/
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: unity-license-state
          path: /tmp/stateout/
          retention-days: 1
