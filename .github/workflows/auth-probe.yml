name: Probe unity-cli auth flow
on: workflow_dispatch
jobs:
  probe:
    name: Inspect unity auth login behavior headless
    runs-on: ubuntu-latest
    steps:
      - name: Install unity-cli
        run: |
          curl -fsSL https://public-cdn.cloud.unity3d.com/hub/prod/cli/install.sh | UNITY_CLI_CHANNEL=beta bash
          export PATH="$HOME/.unity/bin:$PATH"
          unity --version
      - name: Probe auth login output (no completion)
        run: |
          export PATH="$HOME/.unity/bin:$PATH"
          unity auth login --help 2>&1 | head -40
          echo "=== attempting login with 25s capture ==="
          timeout 25 unity auth login --no-store > /tmp/auth.log 2>&1 || true
          echo "--- captured ---"
          cat /tmp/auth.log
