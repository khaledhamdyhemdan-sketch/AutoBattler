name: Unity license relay
on: workflow_dispatch
permissions:
  issues: write
jobs:
  relay:
    name: OAuth relay + Personal license activation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Install unity-cli
        run: |
          curl -fsSL https://public-cdn.cloud.unity3d.com/hub/prod/cli/install.sh | UNITY_CLI_CHANNEL=beta bash
          echo "$HOME/.unity/bin" >> "$GITHUB_PATH"
      - name: Start login and publish URL
        run: |
          unity auth login --insecure-storage --no-banner > /tmp/auth.log 2>&1 &
          echo $! > /tmp/login.pid
          URL=""
          for i in $(seq 1 20); do
            sleep 3
            URL=$(grep -oE 'https://services\.api\.unity\.com[^ ]+' /tmp/auth.log | head -1 || true)
            if [ -n "$URL" ]; then break; fi
          done
          if [ -z "$URL" ]; then echo "NO_URL_CAPTURED"; cat /tmp/auth.log; exit 1; fi
          echo "URL_LEN=${#URL}"
          python3 - "$URL" <<'PY'
          import json, os, sys, urllib.request
          url = sys.argv[1]
          req = urllib.request.Request(
            "https://api.github.com/repos/%s/issues/8/comments" % os.environ["GITHUB_REPOSITORY"],
            data=json.dumps({"body": "LOGIN_URL: " + url}).encode(),
            headers={"Authorization": "Bearer " + os.environ["TOKEN"], "Accept": "application/vnd.github+json"},
            method="POST")
          resp = urllib.request.urlopen(req)
          print("comment posted:", json.load(resp)["id"])
          PY
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Wait for sign-in completion
        run: |
          PID=$(cat /tmp/login.pid)
          DONE=timeout
          for i in $(seq 1 56); do
            sleep 15
            if ! kill -0 $PID 2>/dev/null; then DONE=process-exited; break; fi
            if grep -qiE 'successfully' /tmp/auth.log; then DONE=log-success; break; fi
          done
          echo "wait_result=$DONE"
          echo "--- auth.log ---"; cat /tmp/auth.log
          echo "--- auth status ---"; unity auth status || true
      - name: Activate Personal license
        if: always()
        run: |
          unity license activate --personal --accept-eula || true
          echo "--- license status ---"
          unity license status || true
      - name: Comment outcome
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          tail = open("/tmp/auth.log").read()[-600:]
          body = "relay finished.\n\nauth.log tail:\n```\n" + tail + "\n```"
          req = urllib.request.Request(
            "https://api.github.com/repos/%s/issues/8/comments" % os.environ["GITHUB_REPOSITORY"],
            data=json.dumps({"body": body}).encode(),
            headers={"Authorization": "Bearer " + os.environ["TOKEN"], "Accept": "application/vnd.github+json"},
            method="POST")
          print("comment posted:", json.load(urllib.request.urlopen(req))["id"])
          PY
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
