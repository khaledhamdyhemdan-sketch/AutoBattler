name: Emulator smoke (private-use diagnostics)
on:
  push:
    branches: [ 'feature/emu-smoke' ]
permissions:
  contents: read
  actions: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Fetch latest built APK (no secrets, same-repo artifact)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p apk dl
          RUN=$(cat tools/emu/apk-run.txt)
          gh run download "$RUN" -R "$GITHUB_REPOSITORY" -n AutoBattler-Android-APK -D dl
          cp dl/Chronicles_Android.apk apk/
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator run
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: Nexus 5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash tools/emu/smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emu-out
          path: emu-out/
