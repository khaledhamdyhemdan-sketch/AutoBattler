name: Probe Unity license activation
on: workflow_dispatch
jobs:
  probe:
    name: Try credential activation inside the GameCI image
    runs-on: ubuntu-latest
    steps:
      - name: Activate Personal license with account credentials
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -x
          docker run --rm -e UNITY_EMAIL -e UNITY_PASSWORD \
            unityci/editor:ubuntu-6000.3.0f1-android-4.0.0 bash -c '
              set -e
              /opt/unity/Editor/Data/Resources/Licensing/Client/Unity.Licensing.Client --help 2>&1 | head -60 || true
              unity-editor -batchmode -nographics -quit -logFile /dev/stdout \
                -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD" || true
              find / -name "Unity_lic.ulf" 2>/dev/null | head -3
              mkdir -p /tmp/out && find / -name "Unity_lic.ulf" -exec cp {} /tmp/out/ \; 2>/dev/null || true
              ls -la /tmp/out/
            '
      - name: Report result
        run: echo "probe finished - check log for Unity_lic.ulf path"
