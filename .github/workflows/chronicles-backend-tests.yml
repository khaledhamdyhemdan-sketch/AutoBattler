name: Chronicles backend unit tests

on:
  push:
    branches: [feature/egyptian-heroes-5v5]
    paths:
      - 'server/**'
      - '.github/workflows/chronicles-backend-tests.yml'
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/chronicles-backend-tests.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Node API security and mock-database tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Parse backend source
        run: npm run check
      - name: Run API unit tests with an in-memory mock
        run: npm test
      - name: Clarify trust boundary
        run: echo "Tests validate API behavior with mocks; PostgreSQL migrations, Unity login, TLS and actual online gameplay are not covered."
